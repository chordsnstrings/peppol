<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · ARKS e-Invoicing</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(120% 120% at 50% 0%, #12294a 0%, #0b1a2e 55%, #081422 100%);
        color: #e7edf5; padding: 24px; text-align: center;
      }
      .card {
        max-width: 420px; padding: 40px 32px; border-radius: 24px;
        background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
        backdrop-filter: blur(8px);
      }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px;
        display: grid; place-items: center; font-weight: 800; font-size: 30px;
        color: #0b1a2e; background: linear-gradient(135deg, #e6c978, #c9a84c);
      }
      h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { margin: 0; color: #9db0c8; line-height: 1.6; font-size: 15px; }
      button {
        margin-top: 28px; padding: 12px 22px; border-radius: 12px; border: 0; cursor: pointer;
        font-size: 15px; font-weight: 600; color: #0b1a2e;
        background: linear-gradient(135deg, #e6c978, #c9a84c);
      }
      .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#c9a84c; margin-right:8px; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">A</div>
      <h1>You're offline</h1>
      <p>
        <span class="dot"></span>Your work is saved on this device. ARKS will reconnect
        automatically — anything you drafted offline is safe and will sync when you're back.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
